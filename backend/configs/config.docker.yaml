server:
  host: 0.0.0.0
  port: 8787

security:
  admin_token_ttl_hours: 24
  bootstrap_admin:
    username: admin
    password: change-me
  bootstrap_api_key: ""
  api_key_prefix: "n2a"

database:
  driver: sqlite
  dsn: /app/data/notaion2api.sqlite
  max_idle_conns: 5
  max_open_conns: 20
  conn_max_lifetime_seconds: 3600

upstream:
  base_url: https://www.notion.so
  origin: https://www.notion.so
  timeout_seconds: 180
  poll_interval_seconds: 1.5
  poll_max_rounds: 40

proxy:
  mode: off
  url: ""
  http_url: ""
  https_url: ""

features:
  web_search: true
  generate_image: true
  csv_attachment: true
  fresh_thread_per_request: true
  preserve_system_messages_as_steps: false

dispatch:
  probe_cache_ttl_seconds: 60

sticky:
  enabled: true
  ttl_seconds: 604800
  local_enabled: true
  redis_url: ""
  redis_key_prefix: "n2a:sticky:thread:"
  redis_timeout_seconds: 2

storage:
  persist_conversations: true
  persist_responses: true
  response_ttl_seconds: 3600

login_helper:
  sessions_dir: /app/data/notion_accounts
  timeout_sec: 120
