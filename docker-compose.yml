services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notaion2api-backend
    restart: unless-stopped
    ports:
      - "${N2A_PORT:-9991}:9998"
    volumes:
      - ./backend/configs/config.docker.yaml:/app/config/config.yaml:ro
      - ./data:/app/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      N2A_DATABASE_DRIVER: ${N2A_DATABASE_DRIVER:-}
      N2A_DATABASE_DSN: ${N2A_DATABASE_DSN:-}
      N2A_BOOTSTRAP_ADMIN_USERNAME: ${N2A_BOOTSTRAP_ADMIN_USERNAME:-}
      N2A_BOOTSTRAP_ADMIN_PASSWORD: ${N2A_BOOTSTRAP_ADMIN_PASSWORD:-}
      N2A_BOOTSTRAP_API_KEY: ${N2A_BOOTSTRAP_API_KEY:-}
    command: ["./notaion2api", "--config", "/app/config/config.yaml"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${N2A_FRONTEND_API_BASE_URL:-/api}
    container_name: notaion2api-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${N2A_FRONTEND_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: notaion2api
      POSTGRES_USER: notaion2api
      POSTGRES_PASSWORD: change-me
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg-data:
